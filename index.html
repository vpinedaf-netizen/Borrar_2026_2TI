<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matemáticas Divertidas para Niños</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f0f9ff;
      --card-bg: #ffffff;
      --text: #1e293b;
      --accent: #f59e0b;
      --success: #10b981;
      --error: #ef4444;
    }

    * { 
      box-sizing: border-box; 
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif; 
    }

    body { 
      margin: 0; 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 20px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
    }

    header { 
      text-align: center; 
      margin-bottom: 20px; 
    }

    h1 { 
      color: var(--primary); 
      font-size: 2.5rem; 
      margin: 0 0 10px 0; 
      text-shadow: 2px 2px #bae6fd; 
    }
    
    .nav-tabs { 
      display: flex; 
      gap: 10px; 
      margin-bottom: 20px; 
      flex-wrap: wrap; 
      justify-content: center; 
    }

    .tab-btn { 
      background: #e0f2fe; 
      border: 2px solid #7dd3fc; 
      padding: 12px 20px; 
      border-radius: 15px; 
      font-size: 1.1rem; 
      font-weight: bold; 
      color: #0369a1; 
      cursor: pointer; 
      transition: all 0.2s; 
    }

    .tab-btn.active { 
      background: var(--primary); 
      color: white; 
      border-color: var(--primary-hover); 
      transform: scale(1.05); 
    }

    .container { 
      background: var(--card-bg); 
      border-radius: 24px; 
      padding: 25px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
      width: 100%; 
      max-width: 700px; 
      text-align: center; 
    }
    
    /* Grid Multiplicar */
    .grid-container { 
      display: grid; 
      grid-template-columns: repeat(11, 1fr); 
      gap: 4px; 
      margin-top: 15px; 
      overflow-x: auto; 
    }

    .cell { 
      aspect-ratio: 1; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      background: #f1f5f9; 
      border-radius: 8px; 
      font-weight: bold; 
      cursor: pointer; 
      transition: background 0.2s; 
      font-size: 0.9rem; 
    }

    .cell.header-cell { 
      background: #cbd5e1; 
      color: #0f172a; 
    }

    .cell.highlight { 
      background: #fef08a !important; 
    }

    .cell.selected { 
      background: var(--primary) !important; 
      color: white; 
    }

    .cell:hover { 
      background: #bae6fd; 
    }

    /* Módulo Práctica */
    .practice-box { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 15px; 
    }

    .problem-display { 
      font-size: 3.5rem; 
      font-weight: bold; 
      color: var(--primary); 
      background: #eff6ff; 
      padding: 15px 40px; 
      border-radius: 20px; 
      border: 4px dashed #93c5fd; 
    }

    .input-group { 
      display: flex; 
      gap: 10px; 
      justify-content: center; 
    }

    .num-input { 
      font-size: 2rem; 
      width: 120px; 
      text-align: center; 
      border: 3px solid #cbd5e1; 
      border-radius: 15px; 
      outline: none; 
    }

    .num-input:focus { 
      border-color: var(--primary); 
    }

    .btn-action { 
      background: var(--success); 
      color: white; 
      border: none; 
      padding: 10px 25px; 
      font-size: 1.5rem; 
      border-radius: 15px; 
      cursor: pointer; 
      font-weight: bold; 
    }

    .btn-action:hover { 
      opacity: 0.9; 
    }

    .score-board { 
      font-size: 1.5rem; 
      font-weight: bold; 
      color: var(--accent); 
      margin-bottom: 10px; 
    }

    .feedback { 
      font-size: 1.3rem; 
      font-weight: bold; 
      min-height: 35px; 
      margin-top: 10px; 
    }

    .feedback.correct { color: var(--success); }
    .feedback.incorrect { color: var(--error); }
    
    .difficulty { margin-bottom: 15px; }
    .difficulty button { 
      background: #f1f5f9; 
      border: 1px solid #cbd5e1; 
      padding: 5px 12px; 
      border-radius: 10px; 
      cursor: pointer; 
    }

    .difficulty button.active { 
      background: var(--accent); 
      color: white; 
      border-color: var(--accent); 
    }
  </style>
</head>
<body>

  <header>
    <h1>✨ Mates Divertidas ✨</h1>
    <p>¡Elige una actividad y aprende jugando!</p>
  </header>

  <!-- Pestanias de navegacion -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab(event, 'grid')">✖️ Tabla de Multiplicar</button>
    <button class="tab-btn" onclick="switchTab(event, 'sum')">➕ Sumas</button>
    <button class="tab-btn" onclick="switchTab(event, 'sub')">➖ Restas</button>
    <button class="tab-btn" onclick="switchTab(event, 'mul')">✖️ Multiplicaciones</button>
  </div>

  <div class="container">
    <!-- TABLA INTERACTIVA -->
    <div id="tab-grid" class="tab-content">
      <h2 style="color: var(--primary);">Explora la Tabla de Multiplicar</h2>
      <p>Pasa el ratón sobre los números para ver el resultado:</p>
      <div id="info-hover" style="font-size: 1.5rem; font-weight: bold; color: var(--primary); min-height: 40px;">Selecciona una casilla</div>
      <div id="multiplication-grid" class="grid-container"></div>
    </div>

    <!-- MODULO DE PRACTICA -->
    <div id="tab-practice" class="tab-content" style="display: none;">
      <div class="score-board">⭐ Estrellas: <span id="score">0</span></div>
      
      <div class="difficulty">
        Nivel: 
        <button class="diff-btn active" onclick="setDifficulty(event, 'easy')">Fácil</button>
        <button class="diff-btn" onclick="setDifficulty(event, 'medium')">Normal</button>
        <button class="diff-btn" onclick="setDifficulty(event, 'hard')">Difícil</button>
      </div>

      <div class="practice-box">
        <div class="problem-display" id="problem">5 + 3</div>
        <div class="input-group">
          <input type="number" id="user-answer" class="num-input" placeholder="?" onkeydown="if(event.key==='Enter') checkAnswer()">
          <button class="btn-action" onclick="checkAnswer()">Comprobar</button>
        </div>
        <div id="feedback" class="feedback"></div>
      </div>
    </div>
  </div>

  <script>
    let currentOp = 'sum';
    let difficulty = 'easy';
    let score = 0;
    let num1 = 0, num2 = 0, correctAnswer = 0;

    window.onload = () => {
      buildGrid();
    };

    function switchTab(evt, tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      evt.target.classList.add('active');

      if (tab === 'grid') {
        document.getElementById('tab-grid').style.display = 'block';
        document.getElementById('tab-practice').style.display = 'none';
      } else {
        document.getElementById('tab-grid').style.display = 'none';
        document.getElementById('tab-practice').style.display = 'block';
        currentOp = tab;
        generateProblem();
      }
    }

    function buildGrid() {
      const container = document.getElementById('multiplication-grid');
      container.innerHTML = '';
      
      const empty = document.createElement('div');
      empty.className = 'cell header-cell';
      empty.innerText = '×';
      container.appendChild(empty);

      for (let i = 1; i <= 10; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell header-cell';
        cell.innerText = i;
        container.appendChild(cell);
      }

      for (let r = 1; r <= 10; r++) {
        const rowHeader = document.createElement('div');
        rowHeader.className = 'cell header-cell';
        rowHeader.innerText = r;
        container.appendChild(rowHeader);

        for (let c = 1; c <= 10; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.innerText = r * c;
          cell.dataset.r = r;
          cell.dataset.c = c;

          cell.addEventListener('mouseenter', () => highlight(r, c));
          cell.addEventListener('mouseleave', clearHighlight);
          container.appendChild(cell);
        }
      }
    }

    function highlight(row, col) {
      document.getElementById('info-hover').innerText = `${row} × ${col} = ${row * col}`;
      document.querySelectorAll('.cell').forEach(cell => {
        const r = cell.dataset.r;
        const c = cell.dataset.c;
        if (r == row || c == col) {
          cell.classList.add('highlight');
        }
        if (r == row && c == col) {
          cell.classList.add('selected');
        }
      });
    }

    function clearHighlight() {
      document.getElementById('info-hover').innerText = 'Selecciona una casilla';
      document.querySelectorAll('.cell').forEach(cell => {
        cell.classList.remove('highlight', 'selected');
      });
    }

    function setDifficulty(evt, level) {
      difficulty = level;
      document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
      evt.target.classList.add('active');
      generateProblem();
    }

    function generateProblem() {
      document.getElementById('feedback').innerText = '';
      document.getElementById('user-answer').value = '';
      document.getElementById('user-answer').focus();

      let max = difficulty === 'easy' ? 10 : (difficulty === 'medium' ? 20 : 50);

      if (currentOp === 'sum') {
        num1 = Math.floor(Math.random() * max) + 1;
        num2 = Math.floor(Math.random() * max) + 1;
        correctAnswer = num1 + num2;
        document.getElementById('problem').innerText = `${num1} + ${num2}`;
      } else if (currentOp === 'sub') {
        num1 = Math.floor(Math.random() * max) + 1;
        num2 = Math.floor(Math.random() * num1) + 1;
        correctAnswer = num1 - num2;
        document.getElementById('problem').innerText = `${num1} - ${num2}`;
      } else if (currentOp === 'mul') {
        let maxMul = difficulty === 'easy' ? 5 : (difficulty === 'medium' ? 10 : 12);
        num1 = Math.floor(Math.random() * maxMul) + 1;
        num2 = Math.floor(Math.random() * 10) + 1;
        correctAnswer = num1 * num2;
        document.getElementById('problem').innerText = `${num1} × ${num2}`;
      }
    }

    function checkAnswer() {
      const input = document.getElementById('user-answer').value;
      const feedback = document.getElementById('feedback');
      
      if (input === '') return;

      if (parseInt(input) === correctAnswer) {
        feedback.innerText = '🎉 ¡Excelente! ¡Respuesta correcta!';
        feedback.className = 'feedback correct';
        score += 1;
        document.getElementById('score').innerText = score;
        setTimeout(generateProblem, 1200);
      } else {
        feedback.innerText = '❌ Inténtalo de nuevo, ¡tú puedes!';
        feedback.className = 'feedback incorrect';
      }
    }
  </script>
</body>
</html>
